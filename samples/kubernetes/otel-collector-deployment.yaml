mode: deployment

image:
  repository: otel/opentelemetry-collector-k8s

replicaCount: 1

presets:
  clusterMetrics:
    enabled: true
  kubernetesEvents:
    enabled: true

config:
  exporters:
    otlp_http/mimir:
      endpoint: http://mimir.lgtm.svc.cluster.local:9009/otlp
    otlp_http/loki:
      endpoint: http://loki.lgtm.svc.cluster.local:3100/otlp

  processors:
    batch: {}
    resource/k8sevents:
      attributes:
        - key: service.name
          value: k8s-events
          action: upsert

  service:
    pipelines:
      metrics:
        processors: [batch]
        exporters: [otlp_http/mimir]
      logs:
        processors: [resource/k8sevents, batch]
        exporters: [otlp_http/loki]

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 2Gi
