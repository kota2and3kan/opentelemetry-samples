mode: daemonset

image:
  repository: otel/opentelemetry-collector-k8s

presets:
  kubernetesAttributes:
    enabled: true
  kubeletMetrics:
    enabled: true
  logsCollection:
    enabled: true

config:
  receivers:
    kubeletstats:
      insecure_skip_verify: true

  exporters:
    otlp_http/mimir:
      endpoint: http://mimir.lgtm.svc.cluster.local:9009/otlp
    otlp_http/loki:
      endpoint: http://loki.lgtm.svc.cluster.local:3100/otlp

  processors:
    batch: {}

  service:
    pipelines:
      metrics:
        processors: [batch]
        exporters: [otlp_http/mimir]
      logs:
        processors: [batch]
        exporters: [otlp_http/loki]

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 2Gi
