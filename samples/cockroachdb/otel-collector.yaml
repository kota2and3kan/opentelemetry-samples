mode: deployment

image:
  repository: otel/opentelemetry-collector-contrib

config:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317

    prometheus/cockroachdb:
      config:
        scrape_configs:
          - job_name: cockroachdb
            scrape_interval: 15s
            metrics_path: /_status/vars
            tls_config:
              insecure_skip_verify: true
            dns_sd_configs:
              # Discover CockroachDB pods through the headless Service, since
              # pod names are not stable when deployed by the CockroachDB Operator.
              - names:
                  - "cockroachdb.crdb.svc.cluster.local"
                type: A
                port: 8080

  exporters:
    otlphttp/mimir:
      endpoint: http://mimir.lgtm.svc.cluster.local:9009/otlp
    otlphttp/loki:
      endpoint: http://loki.lgtm.svc.cluster.local:3100/otlp
    otlp/tempo:
      endpoint: tempo.lgtm.svc.cluster.local:4317
      tls:
        insecure: true

  processors:
    batch: {}
    attributes/cockroachdb:
      actions:
        - key: cluster
          value: "cockroachdb"
          action: upsert

  service:
    pipelines:
      metrics:
        receivers: [prometheus/cockroachdb]
        processors: [attributes/cockroachdb, batch]
        exporters: [otlphttp/mimir]
      logs:
        receivers: [otlp]
        processors: [batch]
        exporters: [otlphttp/loki]
      traces:
        receivers: [otlp]
        processors: [batch]
        exporters: [otlp/tempo]
