apiVersion: v1
kind: Pod
metadata:
  name: cockroachdb-client
spec:
  serviceAccountName: cockroachdb
  containers:
  - name: cockroachdb-client
    image: cockroachdb/cockroach:v26.4.0  # Ensure this matches the version of deployed CockroachDB Cluster by the Helm chart
    volumeMounts:
    - name: client-certs
      mountPath: /cockroach/cockroach-certs/
    command:
    - sleep
    - inf
    resources:
      limits:
        cpu: "2000m"
        memory: "4Gi"
      requests:
        cpu: "100m"
        memory: "256Mi"
  terminationGracePeriodSeconds: 0
  volumes:
  - name: client-certs
    projected:
      sources:
        - secret:
            name: cockroachdb-client-secret
            items:
              - key: ca.crt
                path: ca.crt
              - key: tls.crt
                path: client.root.crt
              - key: tls.key
                path: client.root.key
      defaultMode: 256
