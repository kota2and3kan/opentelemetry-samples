apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: otel-auto-inst
spec:
  mode: deployment
  config:
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    exporters:
      otlp_http/mimir:
        endpoint: http://mimir.lgtm.svc.cluster.local:9009/otlp
      otlp_http/loki:
        endpoint: http://loki.lgtm.svc.cluster.local:3100/otlp
      otlp_grpc/tempo:
        endpoint: tempo.lgtm.svc.cluster.local:4317
        tls:
          insecure: true

    processors:
      batch: {}

    service:
      pipelines:
        metrics:
          receivers: [otlp]
          processors: [batch]
          exporters: [otlp_http/mimir]
        logs:
          receivers: [otlp]
          processors: [batch]
          exporters: [otlp_http/loki]
        traces:
          receivers: [otlp]
          processors: [batch]
          exporters: [otlp_grpc/tempo]

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 2Gi
